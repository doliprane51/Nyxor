<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyxor. // Bento Grid Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="bento-container">
        <!-- Profile Bento Box -->
        <div class="bento-card profile-box">
            <div class="avatar-wrapper">
                <img src="assets/avatar.jpg" alt="Nyxor">
                <div class="status-dot"></div>
            </div>
            <h1>Nyxor.</h1>
            <p class="role">&gt; coder · IT · Developpeur_</p>
            <div class="tags">
                <span>Coder</span>
                <span>IT student</span>
                <span>Dev</span>
                <span>20y</span>
            </div>
        </div>

        <!-- Bio / Quote Box -->
        <div class="bento-card quote-box">
            <i class="fa-solid fa-quote-left quote-icon"></i>
            <p>I do not know if I will reach my dream, but I am moving forward, trusting in God_</p>
        </div>

        <!-- Secondary Link Box (@es.monaim_7 - Instagram) -->
        <a href="https://instagram.com/es.monaim_7" target="_blank" class="bento-card link-box">
            <div class="link-avatar">
                <img src="assets/avatar.jpg" alt="Instagram">
            </div>
            <div class="link-info">
                <span class="handle">@es.monaim_7</span>
                <span class="sub">Instagram</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>

        <!-- Music Player Box with Playlist & Controls -->
        <div class="bento-card music-box">
            <div class="album-art" id="albumArtContainer">
                <img src="assets/avatar.jpg" alt="Album Art">
            </div>
            <div class="music-info">
                <span class="song-title" id="songTitle">B.M.S</span>
                <div class="player-controls">
                    <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="playBtn"><i class="fa-solid fa-play"></i></button>
                    <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-container">
                    <span class="time current" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span class="time total" id="durationTime">0:00</span>
                </div>
            </div>
            <audio id="audioPlayer"></audio>
        </div>

        <!-- Social Media Bento Boxes -->
        <a href="https://www.tiktok.com/@es.ameur?_r=1&_t=ZS-9ANzSjdHnMc" target="_blank" class="bento-card social-box tiktok">
            <i class="fa-brands fa-tiktok"></i>
            <span>TikTok</span>
        </a>
        <a href="https://www.snapchat.com/add/abdelmounaim_51?share_id=HnolGgWabs0&locale=en-US" target="_blank" class="bento-card social-box snapchat">
            <i class="fa-brands fa-snapchat"></i>
            <span>Snapchat</span>
        </a>
        <a href="https://open.spotify.com/user/316nsxtnhcsiqg2rhbtes3xg7yk4?si=0DEsbl2AT4-R0yU2G4HWVw&utm_source=copy-link" target="_blank" class="bento-card social-box spotify">
            <i class="fa-brands fa-spotify"></i>
            <span>Spotify</span>
        </a>
    </div>

    <footer class="footer">
        <code>&lt;/&gt; coded by Nyxor (my self)</code>
    </footer>

    <script src="script.js"></script>
</body>
</html>
